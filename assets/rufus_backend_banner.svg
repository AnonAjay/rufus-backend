<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Deep obsidian dark background matching Rufus palette -->
    <linearGradient id="appleDarkBgBackend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Elegant vertical divider gradient fading at top and bottom -->
    <linearGradient id="dividerGradBackend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="25%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="75%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Electric Cyan Multi-layer Glow for OLED Eyes -->
    <filter id="eyeGlowBackend" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Cyan Radial Glow behind the centerpiece -->
    <radialGradient id="ambientHaloBackend" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.22)" />
      <stop offset="45%" stop-color="rgba(0, 229, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0)" />
    </radialGradient>
  </defs>

  <style>
    @keyframes rufusBlinkBackend {
      0%, 90%, 100% {
        transform: scaleY(1);
      }
      93% {
        transform: scaleY(0.08);
      }
      96% {
        transform: scaleY(1);
      }
    }
    .blinking-eye-backend {
      transform-box: fill-box;
      transform-origin: center;
      animation: rufusBlinkBackend 4.5s infinite ease-in-out;
    }
  </style>

  <!-- Card Frame with Apple-grade 20px radius and subtle border -->
  <rect x="1.5" y="1.5" width="877" height="177" rx="20" fill="url(#appleDarkBgBackend)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Ambient Cyan Halo behind the OLED Screen -->
  <circle cx="120" cy="90" r="85" fill="url(#ambientHaloBackend)" />

  <!-- The Rufus Centerpiece (OLED Screen + Electric Cyan Eyes) -->
  <g transform="translate(64, 53)">
    <!-- OLED Bezel -->
    <rect x="0" y="0" width="112" height="74" rx="18" fill="#000000" stroke="rgba(0, 229, 255, 0.38)" stroke-width="1.6" />
    
    <!-- Twin Electric Cyan Eyes with Animated Blink -->
    <g class="blinking-eye-backend">
      <!-- Left Eye -->
      <rect x="22" y="19" width="24" height="36" rx="8" fill="#00E5FF" filter="url(#eyeGlowBackend)" />
      <!-- Right Eye -->
      <rect x="66" y="19" width="24" height="36" rx="8" fill="#00E5FF" filter="url(#eyeGlowBackend)" />
    </g>
  </g>

  <!-- Minimalist Vertical Divider Line -->
  <line x1="230" y1="46" x2="230" y2="134" stroke="url(#dividerGradBackend)" stroke-width="1.2" />

  <!-- Right Side Minimalist Apple-Grade Typography -->
  <g transform="translate(268, 90)">
    <!-- Brand Title -->
    <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">RUFUS</text>
    
    <!-- Tagline -->
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.01em" fill="#94A3B8">Your personalized desktop companion.</text>
  </g>
</svg>